name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# One pipeline per ref; a new commit cancels in-flight work for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Gate (once) ────────────────────────────────────────────────────────────
  lint-and-check:
    name: Lint & Check
    uses: ./.github/workflows/lint-and-check.yml

  # ── Parallel after lint ────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Generate HTML coverage report
        run: bun run coverage:html

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            apps/dataexplorer/coverage/
            packages/rest/coverage/
            packages/rest-server/coverage/
            packages/ui/coverage/
            coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/html/
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build

      - name: Upload DataBrowser artifact
        uses: actions/upload-artifact@v7
        with:
          name: DataBrowser
          path: apps/dataexplorer/DataBrowser
          retention-days: 7

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/.vitepress/dist
          retention-days: 7

  # ── Consumers of the single Build artifact ─────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Download DataBrowser artifact
        uses: actions/download-artifact@v8
        with:
          name: DataBrowser
          path: apps/dataexplorer/DataBrowser

      - name: Install Playwright browsers
        run: cd packages/e2e && bunx playwright install --with-deps

      - name: Start rest-server
        run: |
          cd packages/rest-server
          bun run dev > rest-server.log 2>&1 &
          echo $! > rest-server.pid
          timeout 30 bash -c 'until curl -f http://localhost:7080/health 2>/dev/null; do sleep 1; done' || true
        env:
          PORT: 7080

      - name: Verify rest-server is running
        run: |
          sleep 2
          curl -f http://localhost:7080/health || exit 1
          curl -f http://localhost:7080/dataexplorer/ || exit 1

      - name: Run E2E tests
        run: bun run test:e2e
        timeout-minutes: 50
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:7080' }}
          CI: true

      - name: Stop rest-server
        if: always()
        run: |
          if [ -f packages/rest-server/rest-server.pid ]; then
            kill $(cat packages/rest-server/rest-server.pid) || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 30

      - name: Upload rest-server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rest-server-logs
          path: packages/rest-server/rest-server.log
          retention-days: 7

  # ── Publish / package only after unit + e2e pass ───────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download DataBrowser artifact
        uses: actions/download-artifact@v8
        with:
          name: DataBrowser
          path: apps/dataexplorer/DataBrowser

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=

      - name: Build and push (reuse DataBrowser)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.prebuilt
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  check-pages:
    name: Check GitHub Pages
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify Pages is configured for GitHub Actions
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const enabled = data?.build_type === 'workflow';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              if (!enabled) {
                core.warning(
                  `Pages build_type is "${data?.build_type ?? 'unknown'}", expected "workflow".`
                );
              }
            } catch (error) {
              core.setOutput('enabled', 'false');
              if (error.status === 404) {
                core.warning(
                  'GitHub Pages is not enabled. Enable it at Settings → Pages → Build and deployment → GitHub Actions.'
                );
              } else {
                throw error;
              }
            }

  deploy-docs:
    name: Deploy Docs
    needs: [e2e, check-pages]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.e2e.result == 'success' &&
      needs.check-pages.result == 'success' &&
      needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/docs/.vitepress/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Semver web ZIP on package.json version tag (reuse Build artifact)
  release-web:
    name: Release Web ZIP
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download DataBrowser artifact
        uses: actions/download-artifact@v8
        with:
          name: DataBrowser
          path: apps/dataexplorer/DataBrowser

      - name: Create release archive
        run: |
          set -euo pipefail
          cd apps/dataexplorer
          test -d DataBrowser
          zip -r DataExplorer.zip DataBrowser

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release tag exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: apps/dataexplorer/DataExplorer.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update DataExplorer.zip asset
        if: steps.tag.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            apps/dataexplorer/DataExplorer.zip \
            --clobber

  # ── Desktop (SHA-stamped release; gated by lint) ───────────────────────────
  create-release:
    name: Create Desktop Release
    needs: [e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: meta
        shell: bash
        run: |
          # Append short git SHA so every commit gets a unique SemVer prerelease
          # (e.g. 1.3.3-a4b0436). A fourth dotted segment like 1.3.3.a4b0436 is
          # not valid SemVer and is rejected by Tauri's updater / tauri.conf.
          BASE="$(node -p "require('./apps/desktop/package.json').version")"
          REV="$(git rev-parse --short=7 HEAD)"
          VERSION="${BASE}-${REV}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (assets replaced on upload)"
          else
            # Do not mark as Latest until every platform build has uploaded assets.
            gh release create "$TAG" --title "Release $TAG" --notes "" --latest=false
          fi

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: [e2e, create-release]
    # Run on PRs even when create-release is skipped; never continue if tests failed
    if: >-
      always() &&
      needs.e2e.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 4 || 1 }}
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            target: ''
            args: ''
          - name: Windows (x86_64)
            platform: windows-latest
            target: ''
            args: '--bundles nsis'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            curl

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ -n "${{ needs.create-release.outputs.version }}" ]; then
            echo "version=${{ needs.create-release.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            BASE="$(node -p "require('./apps/desktop/package.json').version")"
            REV="$(git rev-parse --short=7 HEAD)"
            echo "version=${BASE}-${REV}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into desktop manifests
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          if (!version) throw new Error('VERSION is empty');

          const pkgPath = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const confPath = 'apps/desktop/src-tauri/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');

          const cargoPath = 'apps/desktop/src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const next = cargo.replace(
            /^version\s*=\s*"[^"]*"/m,
            `version = "${version}"`,
          );
          if (next === cargo) {
            throw new Error(`Failed to patch version in ${cargoPath}`);
          }
          fs.writeFileSync(cargoPath, next);

          console.log(`Stamped desktop version: ${version}`);
          NODE

      - name: Build desktop app (PR - no release)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

      - name: Build & attach desktop app to release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Release v${{ steps.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          retryAttempts: 5

      - name: Package macOS app (ad-hoc sign, ZIP, SHA-256)
        id: macpkg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x86_64 ;;
            *) ARCH=unknown ;;
          esac
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          APP_PATH="$BUNDLE_DIR/Data Explorer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="Data-Explorer_${VERSION}_${ARCH}.zip"
          STAMP_DIR="$BUNDLE_DIR/quarantine-stamp"
          rm -rf "$STAMP_DIR"
          bash apps/desktop/scripts/stamp-macos-quarantine-assets.sh "$VERSION" "$STAMP_DIR"
          STAGE="$BUNDLE_DIR/zip-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP_PATH" "$STAGE/Data Explorer.app"
          cp "$STAMP_DIR/README.html" "$STAGE/README.html"
          cp "$STAMP_DIR/fix-macos-quarantine.sh" "$STAGE/fix-macos-quarantine.sh"
          chmod +x "$STAGE/fix-macos-quarantine.sh"
          ( cd "$STAGE" && ditto -c -k . "../$ZIP_NAME" )
          rm -rf "$STAGE"
          ( cd "$BUNDLE_DIR" && shasum -a 256 "$ZIP_NAME" | tee "$ZIP_NAME.sha256" )
          echo "zip_path=$BUNDLE_DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_path=$BUNDLE_DIR/$ZIP_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "script_path=$STAMP_DIR/fix-macos-quarantine.sh" >> "$GITHUB_OUTPUT"
          echo "install_sh_path=$STAMP_DIR/install-desktop.sh" >> "$GITHUB_OUTPUT"
          echo "install_ps1_path=$STAMP_DIR/install-desktop.ps1" >> "$GITHUB_OUTPUT"

      - name: Upload macOS ZIP + checksum to release
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          UPLOAD_ARGS=(
            "${{ steps.macpkg.outputs.zip_path }}"
            "${{ steps.macpkg.outputs.sha_path }}"
          )
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            UPLOAD_ARGS+=(
              "${{ steps.macpkg.outputs.script_path }}"
              "${{ steps.macpkg.outputs.install_sh_path }}"
              "${{ steps.macpkg.outputs.install_ps1_path }}"
            )
          fi
          gh release upload "$TAG" "${UPLOAD_ARGS[@]}" --clobber

      - name: Upload desktop bundles artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.target || 'default' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/*/release/bundle/**
          retention-days: 14
          if-no-files-found: ignore

  # Web ZIP on the SHA-stamped desktop release (reuse Build artifact)
  upload-web-zip:
    name: Upload DataExplorer.zip
    needs: [e2e, create-release]
    if: >-
      github.event_name != 'pull_request' &&
      needs.e2e.result == 'success' &&
      needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DataBrowser artifact
        uses: actions/download-artifact@v8
        with:
          name: DataBrowser
          path: apps/dataexplorer/DataBrowser

      - name: Create DataExplorer.zip
        run: |
          set -euo pipefail
          cd apps/dataexplorer
          test -d DataBrowser
          zip -r DataExplorer.zip DataBrowser

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" \
            apps/dataexplorer/DataExplorer.zip \
            --repo "${{ github.repository }}" \
            --clobber

  finalize-release:
    name: Mark release as latest
    needs: [create-release, build-desktop, upload-web-zip]
    if: >-
      github.event_name != 'pull_request' &&
      needs.create-release.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      needs.upload-web-zip.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Rewrite latest.json to browser download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bun apps/desktop/scripts/rewrite-updater-json-urls.ts \
            --tag "${{ needs.create-release.outputs.tag }}" \
            --repo "${{ github.repository }}"

      - name: Set release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --latest

  # Drop SHA-stamped releases that never finished (cancel, fail, or skip).
  cleanup-unfinished-release:
    name: Cleanup unfinished release
    needs: [create-release, build-desktop, upload-web-zip, finalize-release]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.create-release.result == 'success' &&
      needs.finalize-release.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete unfinished release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.create-release.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag to clean up"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already gone"
            exit 0
          fi
          # Never delete a release that was promoted to Latest.
          IS_LATEST="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isLatest -q .isLatest)"
          if [ "$IS_LATEST" = "true" ]; then
            echo "Release $TAG is latest; leaving in place"
            exit 0
          fi
          echo "Deleting unfinished release $TAG"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
