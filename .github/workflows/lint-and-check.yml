name: Lint & Check

on:
  workflow_call:

jobs:
  lint-and-check:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      # biome check covers format + lint; keep canonical class lint + typecheck
      - name: Check (format + lint)
        run: bun run check

      - name: Canonical Tailwind classes
        run: bun run lint:canonical

      - name: Typecheck
        run: bun run typecheck
