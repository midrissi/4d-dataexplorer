name: Download Stats

# Refresh GitHub release download counts onto branch `data/download-stats`:
#   releases/download-stats.json  — aggregate summary (docs UI)
#   releases/<tag>.json           — per-release asset details

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

concurrency:
  group: download-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Update download stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-download-stats.mjs --out-dir /tmp/download-stats-out

      - name: Publish snapshot to data/download-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="data/download-stats"
          WORKTREE="/tmp/download-stats-branch"
          SRC="/tmp/download-stats-out"
          REPO="${GITHUB_REPOSITORY}"

          gh auth setup-git

          rm -rf "$WORKTREE"
          if gh api "repos/${REPO}/branches/${BRANCH}" >/dev/null 2>&1; then
            gh repo clone "$REPO" "$WORKTREE" -- --branch "$BRANCH" --single-branch --depth 1
          else
            gh repo clone "$REPO" "$WORKTREE" -- --depth 1
            (
              cd "$WORKTREE"
              git checkout --orphan "$BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          git -C "$WORKTREE" config user.name "github-actions[bot]"
          git -C "$WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace published stats (everything lives under releases/).
          rm -rf "$WORKTREE/download-stats.json" "$WORKTREE/releases"
          cp -R "$SRC/releases" "$WORKTREE/releases"

          printf '%s\n' \
            '# Download stats snapshot' \
            '' \
            "Generated by \`.github/workflows/download-stats.yml\` on \`${GITHUB_REPOSITORY}\`." \
            "Published to \`${REPO}@${BRANCH}\`." \
            '' \
            '| Path | Contents |' \
            '| --- | --- |' \
            '| `releases/download-stats.json` | Aggregate summary used by the docs site |' \
            '| `releases/<tag>.json` | Per-release asset download details |' \
            '' \
            'Do not edit by hand — push to `main` or wait for the 3-hour schedule.' \
            > "$WORKTREE/README.md"

          cd "$WORKTREE"
          git add -A
          if git diff --cached --quiet; then
            echo "No stats changes; skipping commit"
            exit 0
          fi

          git commit -m "chore(stats): update download-stats snapshot"
          git push origin "HEAD:$BRANCH"
