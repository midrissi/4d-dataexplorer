name: Download Stats

# Refresh GitHub release download counts into the `data/download-stats` branch:
#   releases/download-stats.json  — aggregate summary (docs UI)
#   releases/<tag>.json           — per-release asset details

on:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: download-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Update download stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-download-stats.ts --out-dir /tmp/download-stats-out

      - name: Publish snapshot to data/download-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="data/download-stats"
          WORKTREE="/tmp/download-stats-branch"
          SRC="/tmp/download-stats-out"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$WORKTREE"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git worktree add "$WORKTREE" "origin/$BRANCH"
          else
            git worktree add --detach "$WORKTREE"
            (
              cd "$WORKTREE"
              git checkout --orphan "$BRANCH"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          # Replace published stats (everything lives under releases/).
          rm -rf "$WORKTREE/download-stats.json" "$WORKTREE/releases"
          cp -R "$SRC/releases" "$WORKTREE/releases"

          printf '%s\n' \
            '# Download stats snapshot' \
            '' \
            'Generated by `.github/workflows/download-stats.yml`.' \
            '' \
            '| Path | Contents |' \
            '| --- | --- |' \
            '| `releases/download-stats.json` | Aggregate summary used by the docs site |' \
            '| `releases/<tag>.json` | Per-release asset download details |' \
            '' \
            'Do not edit by hand — push to `main` or wait for the 3-hour schedule.' \
            > "$WORKTREE/README.md"

          cd "$WORKTREE"
          git add -A
          if git diff --cached --quiet; then
            echo "No stats changes; skipping commit"
            exit 0
          fi

          git commit -m "chore(stats): update download-stats snapshot"
          git push origin "HEAD:$BRANCH"
