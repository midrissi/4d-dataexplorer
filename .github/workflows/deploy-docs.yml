name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/dataexplorer/docs/**'
      - 'apps/dataexplorer/src/content/release-notes*.md'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/dataexplorer/docs/**'
      - 'apps/dataexplorer/src/content/release-notes*.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-pages:
    name: Check GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify Pages is configured for GitHub Actions
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const enabled = data?.build_type === 'workflow';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              if (!enabled) {
                core.warning(
                  `Pages build_type is "${data?.build_type ?? 'unknown'}", expected "workflow".`
                );
              }
            } catch (error) {
              core.setOutput('enabled', 'false');
              if (error.status === 404) {
                core.warning(
                  'GitHub Pages is not enabled. Enable it at Settings → Pages → Build and deployment → GitHub Actions.'
                );
              } else {
                throw error;
              }
            }

  build:
    name: Build docs
    runs-on: ubuntu-latest
    needs: check-pages
    if: always() && (needs.check-pages.result == 'success' || needs.check-pages.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun --filter @4d/docs build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-pages.outputs.enabled == 'true'
    needs: [check-pages, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
