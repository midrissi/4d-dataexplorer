[package]
name = "dataexplorer-desktop"
version = "1.4.0"
edition = "2024"
description = "4D Data Explorer Desktop Application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", default-features = false, features = [
    "native-tls",
    "http2",
    "charset",
    "macos-system-configuration",
    "cookies",
    "unsafe-headers",
    "dangerous-settings",
] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-opener = "2.5.4"
# Direct reqwest client for skip-SSL / local HTTPS. Prefer rustls: macOS
# Secure Transport (native-tls) often fails 4D self-signed endpoints with
# "bad protocol version", while browsers and the Vite proxy (secure: false) work.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
