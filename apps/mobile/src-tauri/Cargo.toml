[package]
name = "dataexplorer-mobile"
version = "1.3.4"
edition = "2021"
description = "4D Data Explorer Mobile Application (Beta)"

[lib]
name = "dataexplorer_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", default-features = false, features = [
    # Use rustls for mobile CI cross-compilation.
    # `native-tls` pulls `openssl-sys`, which fails on GitHub runners for Android
    # because OpenSSL for the target triple isn't available.
    "rustls-tls",
    "http2",
    "charset",
    "cookies",
    "unsafe-headers",
    "dangerous-settings",
] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-edge-to-edge = { path = "./plugins/edge-to-edge" }
